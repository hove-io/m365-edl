name: Update public service IPv4 EDLs

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-edl.yml
      - scripts/generate_edl.py
      - tests/**

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: m365-edl-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Synchronize current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main

      - name: Run parser regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Retrieve official service sources
        id: request
        shell: bash
        run: |
          set -euo pipefail

          request_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          request_url="https://endpoints.office.com/endpoints/worldwide?ClientRequestId=${request_id}&Format=JSON"
          response_file="${RUNNER_TEMP}/m365-endpoints-${request_id}.json"
          defender_standard_file="${RUNNER_TEMP}/defender-standard.md"
          defender_antivirus_file="${RUNNER_TEMP}/defender-antivirus.md"
          teams_direct_routing_file="${RUNNER_TEMP}/teams-direct-routing.html"
          intune_endpoints_file="${RUNNER_TEMP}/intune-endpoints.md"
          apple_enterprise_file="${RUNNER_TEMP}/apple-enterprise.html"
          apple_apns_file="${RUNNER_TEMP}/apple-apns.html"
          apple_xcode_dns_observations_file="${RUNNER_TEMP}/apple-xcode-dns-observations.ndjson"
          apple_pcc_dns_observations_file="${RUNNER_TEMP}/apple-pcc-dns-observations.ndjson"
          ubuntu_pro_defaults_file="${RUNNER_TEMP}/ubuntu-pro-defaults.py"
          ubuntu_dns_observations_file="${RUNNER_TEMP}/ubuntu-dns-observations.ndjson"
          microsoft_dns_observations_file="${RUNNER_TEMP}/microsoft-dns-observations.ndjson"
          github_meta_file="${RUNNER_TEMP}/github-meta.json"
          dropbox_firewall_file="${RUNNER_TEMP}/dropbox-firewall.html"
          dropbox_arin_file="${RUNNER_TEMP}/dropbox-arin.json"
          dell_update_file="${RUNNER_TEMP}/dell-command-update.html"
          microsoft_edge_file="${RUNNER_TEMP}/microsoft-edge.html"
          microsoft_windows_file="${RUNNER_TEMP}/microsoft-windows.html"
          microsoft_delivery_optimization_file="${RUNNER_TEMP}/microsoft-delivery-optimization.html"
          windows_diagnostic_endpoints_file="${RUNNER_TEMP}/windows-diagnostic-endpoints.html"
          configmgr_internet_endpoints_file="${RUNNER_TEMP}/configmgr-internet-endpoints.html"

          content_type="$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            --proto '=https' \
            --tlsv1.2 \
            --header 'Accept: application/json' \
            --header 'User-Agent: hove-io-m365-edl/1.0' \
            --output "$response_file" \
            --write-out '%{content_type}' \
            "$request_url")"

          case "$content_type" in
            application/json*) ;;
            *)
              echo "Unexpected Microsoft content type: $content_type" >&2
              exit 1
              ;;
          esac

          download_source() {
            local url="$1"
            local destination="$2"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 60 \
              --proto '=https' \
              --tlsv1.2 \
              --header 'User-Agent: hove-io-m365-edl/1.0' \
              --output "$destination" \
              "$url"
            test -s "$destination"
          }

          download_source \
            'https://raw.githubusercontent.com/MicrosoftDocs/defender-docs/public/defender-endpoint/standard-device-connectivity-urls-commercial.md' \
            "$defender_standard_file"
          download_source \
            'https://raw.githubusercontent.com/MicrosoftDocs/defender-docs/public/defender-endpoint/configure-network-connections-microsoft-defender-antivirus.md' \
            "$defender_antivirus_file"
          download_source \
            'https://learn.microsoft.com/en-us/microsoftteams/direct-routing-plan' \
            "$teams_direct_routing_file"
          download_source \
            'https://raw.githubusercontent.com/MicrosoftDocs/memdocs/main/intune/fundamentals/endpoints.md' \
            "$intune_endpoints_file"
          download_source \
            'https://support.apple.com/en-us/101555' \
            "$apple_enterprise_file"
          download_source \
            'https://developer.apple.com/library/archive/documentation/NetworkingInternet/Conceptual/RemoteNotificationsPG/CommunicatingwithAPNs.html' \
            "$apple_apns_file"
          download_source \
            'https://raw.githubusercontent.com/canonical/ubuntu-pro-client/main/uaclient/defaults.py' \
            "$ubuntu_pro_defaults_file"

          : > "$apple_xcode_dns_observations_file"
          xcode_dns_attempts=8
          xcode_dns_resolver='https://dns.google/resolve'
          xcode_dns_hosts=(
            'devimages-cdn.apple.com'
            'download.developer.apple.com'
          )
          xcode_dns_ecs_subnets=(
            '82.64.0.0/11'
            '82.66.0.0/16'
          )
          for attempt in $(seq 1 "$xcode_dns_attempts"); do
            for fqdn in "${xcode_dns_hosts[@]}"; do
              for ecs_subnet in "${xcode_dns_ecs_subnets[@]}"; do
                dns_response="$(curl \
                  --fail \
                  --silent \
                  --show-error \
                  --location \
                  --retry 3 \
                  --retry-all-errors \
                  --connect-timeout 15 \
                  --max-time 60 \
                  --proto '=https' \
                  --tlsv1.2 \
                  --get \
                  --data-urlencode "name=${fqdn}" \
                  --data-urlencode 'type=A' \
                  --data-urlencode "edns_client_subnet=${ecs_subnet}" \
                  --header 'Accept: application/dns-json' \
                  --header 'User-Agent: hove-io-m365-edl/1.0' \
                  "$xcode_dns_resolver")"
                jq -e '.Status == 0 and (.Answer | type == "array")' \
                  <<< "$dns_response" > /dev/null
                jq -cn \
                  --arg fqdn "$fqdn" \
                  --arg ecsSubnet "$ecs_subnet" \
                  --arg resolver "$xcode_dns_resolver" \
                  --argjson attempt "$attempt" \
                  --argjson response "$dns_response" \
                  '{fqdn: $fqdn, ecsSubnet: $ecsSubnet, resolver: $resolver,
                    attempt: $attempt, response: $response}' \
                  >> "$apple_xcode_dns_observations_file"
              done
            done
            if [[ "$attempt" -lt "$xcode_dns_attempts" ]]; then
              sleep 1
            fi
          done
          test -s "$apple_xcode_dns_observations_file"

          : > "$apple_pcc_dns_observations_file"
          apple_pcc_dns_attempts=8
          apple_pcc_dns_resolver='https://dns.google/resolve'
          apple_pcc_dns_hosts=(
            'apple-relay.cloudflare.com'
            'apple-relay.fastly-edge.com'
            'cp4.cloudflare.com'
          )
          apple_pcc_dns_ecs_subnets=(
            '82.64.0.0/11'
            '82.66.0.0/16'
          )
          for attempt in $(seq 1 "$apple_pcc_dns_attempts"); do
            for fqdn in "${apple_pcc_dns_hosts[@]}"; do
              for ecs_subnet in "${apple_pcc_dns_ecs_subnets[@]}"; do
                dns_response="$(curl \
                  --fail \
                  --silent \
                  --show-error \
                  --location \
                  --retry 3 \
                  --retry-all-errors \
                  --connect-timeout 15 \
                  --max-time 60 \
                  --proto '=https' \
                  --tlsv1.2 \
                  --get \
                  --data-urlencode "name=${fqdn}" \
                  --data-urlencode 'type=A' \
                  --data-urlencode "edns_client_subnet=${ecs_subnet}" \
                  --header 'Accept: application/dns-json' \
                  --header 'User-Agent: hove-io-m365-edl/1.0' \
                  "$apple_pcc_dns_resolver")"
                jq -e '.Status == 0 and (.Answer | type == "array")' \
                  <<< "$dns_response" > /dev/null
                jq -cn \
                  --arg fqdn "$fqdn" \
                  --arg ecsSubnet "$ecs_subnet" \
                  --arg resolver "$apple_pcc_dns_resolver" \
                  --argjson attempt "$attempt" \
                  --argjson response "$dns_response" \
                  '{fqdn: $fqdn, ecsSubnet: $ecsSubnet, resolver: $resolver,
                    attempt: $attempt, response: $response}' \
                  >> "$apple_pcc_dns_observations_file"
              done
            done
            if [[ "$attempt" -lt "$apple_pcc_dns_attempts" ]]; then
              sleep 1
            fi
          done
          test -s "$apple_pcc_dns_observations_file"

          : > "$ubuntu_dns_observations_file"
          ubuntu_dns_attempts=8
          ubuntu_dns_resolver='https://dns.google/resolve'
          ubuntu_dns_ecs_subnets=(
            '82.64.0.0/11'
            '82.66.0.0/16'
          )
          for attempt in $(seq 1 "$ubuntu_dns_attempts"); do
            for ecs_subnet in "${ubuntu_dns_ecs_subnets[@]}"; do
              dns_response="$(curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --retry 3 \
                --retry-all-errors \
                --connect-timeout 15 \
                --max-time 60 \
                --proto '=https' \
                --tlsv1.2 \
                --get \
                --data-urlencode 'name=motd.ubuntu.com' \
                --data-urlencode 'type=A' \
                --data-urlencode "edns_client_subnet=${ecs_subnet}" \
                --header 'Accept: application/dns-json' \
                --header 'User-Agent: hove-io-m365-edl/1.0' \
                "$ubuntu_dns_resolver")"
              jq -e '.Status == 0 and (.Answer | type == "array")' \
                <<< "$dns_response" > /dev/null
              jq -cn \
                --arg fqdn 'motd.ubuntu.com' \
                --arg ecsSubnet "$ecs_subnet" \
                --arg resolver "$ubuntu_dns_resolver" \
                --argjson attempt "$attempt" \
                --argjson response "$dns_response" \
                '{fqdn: $fqdn, ecsSubnet: $ecsSubnet, resolver: $resolver,
                  attempt: $attempt, response: $response}' \
                >> "$ubuntu_dns_observations_file"
            done
            if [[ "$attempt" -lt "$ubuntu_dns_attempts" ]]; then
              sleep 1
            fi
          done
          test -s "$ubuntu_dns_observations_file"

          : > "$microsoft_dns_observations_file"
          microsoft_dns_attempts=8
          microsoft_dns_resolver='https://dns.google/resolve'
          microsoft_dns_hosts=(
            'events.data.microsoft.com'
            'functional.events.data.microsoft.com'
            'self.events.data.microsoft.com'
            'v10.events.data.microsoft.com'
            'v10c.events.data.microsoft.com'
            'v20.events.data.microsoft.com'
            'mobile.events.data.microsoft.com'
            'browser.events.data.microsoft.com'
            'au-mobile.events.data.microsoft.com'
            'eu-mobile.events.data.microsoft.com'
            'uk-mobile.events.data.microsoft.com'
            'us-mobile.events.data.microsoft.com'
            'au-v20.events.data.microsoft.com'
            'eu-v20.events.data.microsoft.com'
            'uk-v20.events.data.microsoft.com'
            'us-v20.events.data.microsoft.com'
            'umwatsonc.events.data.microsoft.com'
            'watson.events.data.microsoft.com'
            'adl.windows.com'
            'array511.prod.do.dsp.mp.microsoft.com'
            'array804.prod.do.dsp.mp.microsoft.com'
            'settings.data.microsoft.com'
            'settings-win.data.microsoft.com'
            'config.edge.skype.com'
            'ctldl.windowsupdate.com'
            'dl.delivery.mp.microsoft.com'
            'download.windowsupdate.com'
            'fe3cr.delivery.mp.microsoft.com'
            'update.microsoft.com'
          )
          microsoft_dns_ecs_subnets=(
            '82.64.0.0/11'
            '82.66.0.0/16'
          )
          for attempt in $(seq 1 "$microsoft_dns_attempts"); do
            for fqdn in "${microsoft_dns_hosts[@]}"; do
              for ecs_subnet in "${microsoft_dns_ecs_subnets[@]}"; do
                dns_response="$(curl \
                  --fail \
                  --silent \
                  --show-error \
                  --location \
                  --retry 3 \
                  --retry-all-errors \
                  --connect-timeout 15 \
                  --max-time 60 \
                  --proto '=https' \
                  --tlsv1.2 \
                  --get \
                  --data-urlencode "name=${fqdn}" \
                  --data-urlencode 'type=A' \
                  --data-urlencode "edns_client_subnet=${ecs_subnet}" \
                  --header 'Accept: application/dns-json' \
                  --header 'User-Agent: hove-io-m365-edl/1.0' \
                  "$microsoft_dns_resolver")"
                jq -e '.Status == 0 and (.Answer | type == "array")' \
                  <<< "$dns_response" > /dev/null
                jq -cn \
                  --arg fqdn "$fqdn" \
                  --arg ecsSubnet "$ecs_subnet" \
                  --arg resolver "$microsoft_dns_resolver" \
                  --argjson attempt "$attempt" \
                  --argjson response "$dns_response" \
                  '{fqdn: $fqdn, ecsSubnet: $ecsSubnet, resolver: $resolver,
                    attempt: $attempt, response: $response}' \
                  >> "$microsoft_dns_observations_file"
              done
            done
            if [[ "$attempt" -lt "$microsoft_dns_attempts" ]]; then
              sleep 1
            fi
          done
          test -s "$microsoft_dns_observations_file"
          download_source \
            'https://api.github.com/meta' \
            "$github_meta_file"
          download_source \
            'https://help.dropbox.com/installs/configuring-firewall' \
            "$dropbox_firewall_file"
          download_source \
            'https://whois.arin.net/rest/org/DROPB/nets.json' \
            "$dropbox_arin_file"
          download_source \
            'https://downloads.dell.com/catalog/CatalogPC.cab' \
            "$dell_update_file"
          download_source \
            'https://learn.microsoft.com/en-us/deployedge/microsoft-edge-security-endpoints' \
            "$microsoft_edge_file"
          download_source \
            'https://learn.microsoft.com/en-us/windows/privacy/manage-windows-11-endpoints' \
            "$microsoft_windows_file"
          download_source \
            'https://learn.microsoft.com/en-us/windows/deployment/do/delivery-optimization-workflow' \
            "$microsoft_delivery_optimization_file"
          download_source \
            'https://learn.microsoft.com/en-us/windows/privacy/windows-11-endpoints-non-enterprise-editions' \
            "$windows_diagnostic_endpoints_file"
          download_source \
            'https://learn.microsoft.com/en-us/intune/configmgr/core/plan-design/network/internet-endpoints' \
            "$configmgr_internet_endpoints_file"

          test -s "$response_file"
          printf 'request_id=%s\n' "$request_id" >> "$GITHUB_OUTPUT"
          printf 'request_url=%s\n' "$request_url" >> "$GITHUB_OUTPUT"
          printf 'response_file=%s\n' "$response_file" >> "$GITHUB_OUTPUT"
          printf 'defender_standard_file=%s\n' "$defender_standard_file" >> "$GITHUB_OUTPUT"
          printf 'defender_antivirus_file=%s\n' "$defender_antivirus_file" >> "$GITHUB_OUTPUT"
          printf 'teams_direct_routing_file=%s\n' "$teams_direct_routing_file" >> "$GITHUB_OUTPUT"
          printf 'intune_endpoints_file=%s\n' "$intune_endpoints_file" >> "$GITHUB_OUTPUT"
          printf 'apple_enterprise_file=%s\n' "$apple_enterprise_file" >> "$GITHUB_OUTPUT"
          printf 'apple_apns_file=%s\n' "$apple_apns_file" >> "$GITHUB_OUTPUT"
          printf 'apple_xcode_dns_observations_file=%s\n' "$apple_xcode_dns_observations_file" >> "$GITHUB_OUTPUT"
          printf 'apple_pcc_dns_observations_file=%s\n' "$apple_pcc_dns_observations_file" >> "$GITHUB_OUTPUT"
          printf 'ubuntu_pro_defaults_file=%s\n' "$ubuntu_pro_defaults_file" >> "$GITHUB_OUTPUT"
          printf 'ubuntu_dns_observations_file=%s\n' "$ubuntu_dns_observations_file" >> "$GITHUB_OUTPUT"
          printf 'microsoft_dns_observations_file=%s\n' "$microsoft_dns_observations_file" >> "$GITHUB_OUTPUT"
          printf 'github_meta_file=%s\n' "$github_meta_file" >> "$GITHUB_OUTPUT"
          printf 'dropbox_firewall_file=%s\n' "$dropbox_firewall_file" >> "$GITHUB_OUTPUT"
          printf 'dropbox_arin_file=%s\n' "$dropbox_arin_file" >> "$GITHUB_OUTPUT"
          printf 'dell_update_file=%s\n' "$dell_update_file" >> "$GITHUB_OUTPUT"
          printf 'microsoft_edge_file=%s\n' "$microsoft_edge_file" >> "$GITHUB_OUTPUT"
          printf 'microsoft_windows_file=%s\n' "$microsoft_windows_file" >> "$GITHUB_OUTPUT"
          printf 'microsoft_delivery_optimization_file=%s\n' "$microsoft_delivery_optimization_file" >> "$GITHUB_OUTPUT"
          printf 'windows_diagnostic_endpoints_file=%s\n' "$windows_diagnostic_endpoints_file" >> "$GITHUB_OUTPUT"
          printf 'configmgr_internet_endpoints_file=%s\n' "$configmgr_internet_endpoints_file" >> "$GITHUB_OUTPUT"

      - name: Generate and validate EDL files
        run: |
          python3 scripts/generate_edl.py \
            --input-file "${{ steps.request.outputs.response_file }}" \
            --request-id "${{ steps.request.outputs.request_id }}" \
            --request-url "${{ steps.request.outputs.request_url }}" \
            --defender-standard-file "${{ steps.request.outputs.defender_standard_file }}" \
            --defender-antivirus-file "${{ steps.request.outputs.defender_antivirus_file }}" \
            --teams-direct-routing-file "${{ steps.request.outputs.teams_direct_routing_file }}" \
            --intune-endpoints-file "${{ steps.request.outputs.intune_endpoints_file }}" \
            --apple-enterprise-file "${{ steps.request.outputs.apple_enterprise_file }}" \
            --apple-apns-file "${{ steps.request.outputs.apple_apns_file }}" \
            --apple-xcode-dns-observations-file "${{ steps.request.outputs.apple_xcode_dns_observations_file }}" \
            --apple-pcc-dns-observations-file "${{ steps.request.outputs.apple_pcc_dns_observations_file }}" \
            --ubuntu-pro-defaults-file "${{ steps.request.outputs.ubuntu_pro_defaults_file }}" \
            --ubuntu-dns-observations-file "${{ steps.request.outputs.ubuntu_dns_observations_file }}" \
            --microsoft-dns-observations-file "${{ steps.request.outputs.microsoft_dns_observations_file }}" \
            --github-meta-file "${{ steps.request.outputs.github_meta_file }}" \
            --dropbox-firewall-file "${{ steps.request.outputs.dropbox_firewall_file }}" \
            --dropbox-arin-file "${{ steps.request.outputs.dropbox_arin_file }}" \
            --dell-update-file "${{ steps.request.outputs.dell_update_file }}" \
            --microsoft-edge-file "${{ steps.request.outputs.microsoft_edge_file }}" \
            --microsoft-windows-file "${{ steps.request.outputs.microsoft_windows_file }}" \
            --microsoft-delivery-optimization-file "${{ steps.request.outputs.microsoft_delivery_optimization_file }}" \
            --windows-diagnostic-endpoints-file "${{ steps.request.outputs.windows_diagnostic_endpoints_file }}" \
            --configmgr-internet-endpoints-file "${{ steps.request.outputs.configmgr_internet_endpoints_file }}" \
            --output-dir docs

      - name: Detect publication changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- docs)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Validated publication changes detected"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication changes detected"
          fi

      - name: Commit and push changed EDL files
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/.nojekyll \
            docs/apple-appstore-content-ipv4.txt \
            docs/apple-device-services-ipv4.txt \
            docs/apple-updates-ipv4.txt \
            docs/apple-xcode-developer-ipv4.txt \
            docs/dell-update-ipv4.txt \
            docs/dropbox-ipv4.txt \
            docs/github-actions-ipv4.txt \
            docs/github-ipv4.txt \
            docs/index.html \
            docs/sources.json \
            docs/m365-common-ipv4.txt \
            docs/m365-exchange-ipv4.txt \
            docs/m365-sharepoint-ipv4.txt \
            docs/m365-teams-ipv4.txt \
            docs/microsoft-defender-ipv4.txt \
            docs/microsoft-edge-windows-services-ipv4.txt \
            docs/microsoft-intune-windows-ipv4.txt \
            docs/microsoft-teams-media-ipv4.txt \
            docs/residual-ip-coverage.json \
            docs/ubuntu-motd-ipv4.txt
          git diff --cached --check
          git commit -m "Update public service IPv4 EDLs"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v5

name: Update public service IPv4 EDLs

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-edl.yml
      - scripts/generate_edl.py
      - tests/**

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: m365-edl-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run parser regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Retrieve official service sources
        id: request
        shell: bash
        run: |
          set -euo pipefail

          request_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          request_url="https://endpoints.office.com/endpoints/worldwide?ClientRequestId=${request_id}&Format=JSON"
          response_file="${RUNNER_TEMP}/m365-endpoints-${request_id}.json"
          defender_standard_file="${RUNNER_TEMP}/defender-standard.md"
          defender_antivirus_file="${RUNNER_TEMP}/defender-antivirus.md"
          teams_direct_routing_file="${RUNNER_TEMP}/teams-direct-routing.html"
          intune_endpoints_file="${RUNNER_TEMP}/intune-endpoints.md"
          apple_enterprise_file="${RUNNER_TEMP}/apple-enterprise.html"
          apple_apns_file="${RUNNER_TEMP}/apple-apns.html"
          github_meta_file="${RUNNER_TEMP}/github-meta.json"
          dropbox_firewall_file="${RUNNER_TEMP}/dropbox-firewall.html"
          dropbox_arin_file="${RUNNER_TEMP}/dropbox-arin.json"
          dell_update_file="${RUNNER_TEMP}/dell-command-update.html"
          microsoft_edge_file="${RUNNER_TEMP}/microsoft-edge.html"
          microsoft_windows_file="${RUNNER_TEMP}/microsoft-windows.html"
          microsoft_delivery_optimization_file="${RUNNER_TEMP}/microsoft-delivery-optimization.html"

          content_type="$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            --proto '=https' \
            --tlsv1.2 \
            --header 'Accept: application/json' \
            --header 'User-Agent: hove-io-m365-edl/1.0' \
            --output "$response_file" \
            --write-out '%{content_type}' \
            "$request_url")"

          case "$content_type" in
            application/json*) ;;
            *)
              echo "Unexpected Microsoft content type: $content_type" >&2
              exit 1
              ;;
          esac

          download_source() {
            local url="$1"
            local destination="$2"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 60 \
              --proto '=https' \
              --tlsv1.2 \
              --header 'User-Agent: hove-io-m365-edl/1.0' \
              --output "$destination" \
              "$url"
            test -s "$destination"
          }

          download_source \
            'https://raw.githubusercontent.com/MicrosoftDocs/defender-docs/public/defender-endpoint/standard-device-connectivity-urls-commercial.md' \
            "$defender_standard_file"
          download_source \
            'https://raw.githubusercontent.com/MicrosoftDocs/defender-docs/public/defender-endpoint/configure-network-connections-microsoft-defender-antivirus.md' \
            "$defender_antivirus_file"
          download_source \
            'https://learn.microsoft.com/en-us/microsoftteams/direct-routing-plan' \
            "$teams_direct_routing_file"
          download_source \
            'https://raw.githubusercontent.com/MicrosoftDocs/memdocs/main/intune/fundamentals/endpoints.md' \
            "$intune_endpoints_file"
          download_source \
            'https://support.apple.com/en-us/101555' \
            "$apple_enterprise_file"
          download_source \
            'https://developer.apple.com/library/archive/documentation/NetworkingInternet/Conceptual/RemoteNotificationsPG/CommunicatingwithAPNs.html' \
            "$apple_apns_file"
          download_source \
            'https://api.github.com/meta' \
            "$github_meta_file"
          download_source \
            'https://help.dropbox.com/installs/configuring-firewall' \
            "$dropbox_firewall_file"
          download_source \
            'https://whois.arin.net/rest/org/DROPB/nets.json' \
            "$dropbox_arin_file"
          download_source \
            'https://downloads.dell.com/catalog/CatalogPC.cab' \
            "$dell_update_file"
          download_source \
            'https://learn.microsoft.com/en-us/deployedge/microsoft-edge-security-endpoints' \
            "$microsoft_edge_file"
          download_source \
            'https://learn.microsoft.com/en-us/windows/privacy/manage-windows-11-endpoints' \
            "$microsoft_windows_file"
          download_source \
            'https://learn.microsoft.com/en-us/windows/deployment/do/delivery-optimization-workflow' \
            "$microsoft_delivery_optimization_file"

          test -s "$response_file"
          printf 'request_id=%s\n' "$request_id" >> "$GITHUB_OUTPUT"
          printf 'request_url=%s\n' "$request_url" >> "$GITHUB_OUTPUT"
          printf 'response_file=%s\n' "$response_file" >> "$GITHUB_OUTPUT"
          printf 'defender_standard_file=%s\n' "$defender_standard_file" >> "$GITHUB_OUTPUT"
          printf 'defender_antivirus_file=%s\n' "$defender_antivirus_file" >> "$GITHUB_OUTPUT"
          printf 'teams_direct_routing_file=%s\n' "$teams_direct_routing_file" >> "$GITHUB_OUTPUT"
          printf 'intune_endpoints_file=%s\n' "$intune_endpoints_file" >> "$GITHUB_OUTPUT"
          printf 'apple_enterprise_file=%s\n' "$apple_enterprise_file" >> "$GITHUB_OUTPUT"
          printf 'apple_apns_file=%s\n' "$apple_apns_file" >> "$GITHUB_OUTPUT"
          printf 'github_meta_file=%s\n' "$github_meta_file" >> "$GITHUB_OUTPUT"
          printf 'dropbox_firewall_file=%s\n' "$dropbox_firewall_file" >> "$GITHUB_OUTPUT"
          printf 'dropbox_arin_file=%s\n' "$dropbox_arin_file" >> "$GITHUB_OUTPUT"
          printf 'dell_update_file=%s\n' "$dell_update_file" >> "$GITHUB_OUTPUT"
          printf 'microsoft_edge_file=%s\n' "$microsoft_edge_file" >> "$GITHUB_OUTPUT"
          printf 'microsoft_windows_file=%s\n' "$microsoft_windows_file" >> "$GITHUB_OUTPUT"
          printf 'microsoft_delivery_optimization_file=%s\n' "$microsoft_delivery_optimization_file" >> "$GITHUB_OUTPUT"

      - name: Generate and validate EDL files
        run: |
          python3 scripts/generate_edl.py \
            --input-file "${{ steps.request.outputs.response_file }}" \
            --request-id "${{ steps.request.outputs.request_id }}" \
            --request-url "${{ steps.request.outputs.request_url }}" \
            --defender-standard-file "${{ steps.request.outputs.defender_standard_file }}" \
            --defender-antivirus-file "${{ steps.request.outputs.defender_antivirus_file }}" \
            --teams-direct-routing-file "${{ steps.request.outputs.teams_direct_routing_file }}" \
            --intune-endpoints-file "${{ steps.request.outputs.intune_endpoints_file }}" \
            --apple-enterprise-file "${{ steps.request.outputs.apple_enterprise_file }}" \
            --apple-apns-file "${{ steps.request.outputs.apple_apns_file }}" \
            --github-meta-file "${{ steps.request.outputs.github_meta_file }}" \
            --dropbox-firewall-file "${{ steps.request.outputs.dropbox_firewall_file }}" \
            --dropbox-arin-file "${{ steps.request.outputs.dropbox_arin_file }}" \
            --dell-update-file "${{ steps.request.outputs.dell_update_file }}" \
            --microsoft-edge-file "${{ steps.request.outputs.microsoft_edge_file }}" \
            --microsoft-windows-file "${{ steps.request.outputs.microsoft_windows_file }}" \
            --microsoft-delivery-optimization-file "${{ steps.request.outputs.microsoft_delivery_optimization_file }}" \
            --output-dir docs

      - name: Detect publication changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- docs)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Validated publication changes detected"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication changes detected"
          fi

      - name: Commit and push changed EDL files
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/.nojekyll \
            docs/apple-appstore-content-ipv4.txt \
            docs/apple-device-services-ipv4.txt \
            docs/apple-updates-ipv4.txt \
            docs/apple-xcode-developer-ipv4.txt \
            docs/dell-update-ipv4.txt \
            docs/dropbox-ipv4.txt \
            docs/github-ipv4.txt \
            docs/index.html \
            docs/sources.json \
            docs/m365-common-ipv4.txt \
            docs/m365-exchange-ipv4.txt \
            docs/m365-sharepoint-ipv4.txt \
            docs/m365-teams-ipv4.txt \
            docs/microsoft-defender-ipv4.txt \
            docs/microsoft-edge-windows-services-ipv4.txt \
            docs/microsoft-intune-windows-ipv4.txt \
            docs/microsoft-teams-media-ipv4.txt \
            docs/residual-ip-coverage.json
          git diff --cached --check
          git commit -m "Update public service IPv4 EDLs"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v5
